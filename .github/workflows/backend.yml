name: Deploy MCI Finance backend to UAT

# UAT server (Tencent, crm-mci.neuvebooks.com). Production (main) deploys to Azure: azure-prod.yml
on:
  push:
    branches:
      - uat
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

concurrency:
  group: mci-crm-backend-deploy
  cancel-in-progress: false

jobs:
  # Lint, typecheck, tests and audit must pass before anything is deployed
  ci:
    uses: ./.github/workflows/ci.yml

  build-and-deploy:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: mci-crm-backend:${{ github.sha }}
          outputs: type=docker,dest=/tmp/mci-crm-backend.tar

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TENCENT_SSH_KEY }}
          SSH_HOST: ${{ secrets.TENCENT_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload Docker image
        env:
          SSH_HOST: ${{ secrets.TENCENT_HOST }}
          SSH_USER: ${{ secrets.TENCENT_USER }}
        run: |
          gzip -1 -c /tmp/mci-crm-backend.tar | ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "cat > /tmp/mci-crm-backend.tar.gz"

      - name: Deploy backend
        env:
          SSH_HOST: ${{ secrets.TENCENT_HOST }}
          SSH_USER: ${{ secrets.TENCENT_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
            set -eu

            CONTAINER="mci-crm-backend"
            IMAGE="mci-crm-backend:$IMAGE_TAG"
            ENV_FILE="/home/ubuntu/mci-crm/.env"
            ARCHIVE="/tmp/mci-crm-backend.tar.gz"
            BACKUP_CONTAINER="mci-crm-backend-rollback"
            PORT="4000"
            # The backend reaches MongoDB by container name on this network
            NETWORK="test-network"
            # Customer documents live here so they survive redeploys
            UPLOADS_VOLUME="mci_crm_uploads"

            test -f "$ENV_FILE"
            test -s "$ARCHIVE"

            gunzip -c "$ARCHIVE" | docker load
            rm -f "$ARCHIVE"

            HAD_OLD=false

            if docker container inspect "$CONTAINER" >/dev/null 2>&1; then
              docker rm -f "$BACKUP_CONTAINER" >/dev/null 2>&1 || true
              docker rename "$CONTAINER" "$BACKUP_CONTAINER"
              # Stop it so the new container can take the port
              docker stop "$BACKUP_CONTAINER" >/dev/null
              HAD_OLD=true
            fi

            rollback() {
              echo "Deployment failed; restoring previous container."
              docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
              if [ "$HAD_OLD" = true ]; then
                docker rename "$BACKUP_CONTAINER" "$CONTAINER" || true
                docker start "$CONTAINER" || true
              fi
            }

            if ! docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              --network "$NETWORK" \
              --env-file "$ENV_FILE" \
              -v "$UPLOADS_VOLUME:/data/uploads" \
              -p "127.0.0.1:$PORT:$PORT" \
              --log-opt max-size=20m --log-opt max-file=5 \
              "$IMAGE"; then
              rollback
              exit 1
            fi

            # Healthy = the API answers /api/health (which also checks MongoDB) without having restarted
            HEALTHY=false
            for i in $(seq 1 20); do
              sleep 3
              if [ "$(docker inspect -f '{{.RestartCount}}' "$CONTAINER")" != "0" ]; then
                break
              fi
              if curl -fsS -m 3 "http://127.0.0.1:$PORT/api/health" >/dev/null 2>&1; then
                HEALTHY=true
                break
              fi
            done

            if [ "$HEALTHY" != true ]; then
              docker logs --tail 100 "$CONTAINER" || true
              rollback
              exit 1
            fi

            if [ "$HAD_OLD" = true ]; then
              docker rm -f "$BACKUP_CONTAINER"
            fi

            # Keep the current and previous image (for a manual rollback); delete older ones
            docker images mci-crm-backend --format '{{.Repository}}:{{.Tag}}' | tail -n +3 | xargs -r docker rmi || true
            docker image prune -f >/dev/null || true

            echo "MCI CRM backend container is healthy."
            curl -fsS "http://127.0.0.1:$PORT/api/health"; echo
            docker ps --filter "name=$CONTAINER"
          REMOTE
