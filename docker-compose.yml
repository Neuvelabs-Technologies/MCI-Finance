services:
  # React app + nginx. The only service exposed to the outside; it forwards /api to the backend.
  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:4000
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

  # Express API
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/mci_einvoice
      UPLOAD_DIR: /data/uploads
      NODE_ENV: production
    volumes:
      - uploads:/data/uploads
    depends_on:
      mongo:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  uploads:
  mongo:
